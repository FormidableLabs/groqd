name: Unit Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 18
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit Test
        run: pnpm run test
